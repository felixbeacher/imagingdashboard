# the YAML file acts as an orchestrator
# This automated workflow runs every Monday to....
# 1. set up Python
# 2. execute the 1_update_news_ai.py script to fetch fresh data for the dashboard
# the Python script (1_update_news_ai.py)  fetches live data and rewrites or updates your HTML files locally on the server.
# The YAML file saves the changes and automatically commist and pushes them back into your GitHub repository so the site has live updates.

name: Weekly Dashboard Update

on:
  schedule:
    # Runs daily at 06:17 UTC
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Latest News & Update Dashboard
        run: python update_news.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live news links" && git push)
