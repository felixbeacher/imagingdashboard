# Refresh AI independently while the other modality updaters are being repaired.
# Keep the source HTML templates and Python scripts in the repository root.
# Publish the generated _site artifact directly; only dated iShares valuation snapshots are archived.
# Set Settings > Pages > Build and deployment > Source to GitHub Actions.
name: Weekly Dashboard Update

on:
  schedule:
    # Every Monday at 06:17 UTC (07:17 UK time during British Summer Time).
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly.yml'
      - '*.html'
      - '*.py'
      - '*.json'
      - '*.csv'
      - '*.svg'
      - 'styles.css'
      - 'images/**'

# Serialize publication so scheduled and manual runs cannot race each other.
concurrency:
  group: imaging-dashboard-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-news:
    # Publish from the default branch, including manually triggered runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout source templates and scripts
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Inspect public OECD imaging dataset format
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          datasets=[
            'OECD.ELS.HD,DSD_HEALTH_PROC@DF_DIAG_EXAM,/CHE..EXM_10P3PS...............',
            'OECD.ELS.HD,DSD_HEALTH_REAC_HOSP@DF_MED_TECH,/CHE..10P6HB......_T'
          ]
          for ds in datasets:
            url='https://sdmx.oecd.org/public/rest/v1/data/'+ds+'?startPeriod=2019'
            print('OECD CHECK',ds,flush=True)
            for accept in ('csvfilewithlabels','csvfile','text/csv'):
              try:
                req=Request(url,headers={'Accept':accept,'User-Agent':'MedicalImagingDashboard/1.0'})
                with urlopen(req,timeout=22) as resp:
                  data=resp.read(5500).decode('utf-8-sig',errors='replace')
                  print('STATUS',resp.status,'TYPE',resp.headers.get('Content-Type'),'ACCEPT',accept,'SAMPLE',repr(data[:1850]),flush=True)
                break
              except Exception as e:
                print('RETRIEVAL',accept,type(e).__name__,str(e)[:200],flush=True)
          PY

      - name: Validate collectors and rendering
        run: python -m unittest discover -p 'test_*.py'

      - name: Check Glob Econ browser JavaScript
        # Python tests validate data and markup; Node catches client-side syntax errors.
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('global-macro.template.html', 'global-macro.html'):
              html = Path(name).read_text(encoding='utf-8')
              matches = re.findall(r"<script>'use strict';(.*?)</script>", html, re.S)
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one inline dashboard script')
              Path(name + '.validate.js').write_text("'use strict';" + matches[0], encoding='utf-8')
          PY
          node --check global-macro.template.html.validate.js
          node --check global-macro.html.validate.js
          rm global-macro.template.html.validate.js global-macro.html.validate.js

      # Collectors and macro Gemini REST integration use the standard library.
      - name: Fetch data and build AI and Glob Econ dashboards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MACRO_GEMINI_MODEL: ${{ vars.MACRO_GEMINI_MODEL || 'gemini-3.8-flash' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          output = root / '_site'
          dashboards = [
              ('AI', 'ai_update_data.py', 'ai.html'),
          ]
          required = ['index.html', 'styles.css', 'images/earth-hero.png', 'ai.template.html', 'macro_dashboard.py', 'macro_briefing.py', 'global_valuation.py', 'global-macro.template.html', 'risk.svg', 'risk-data.csv', 'global-risk-report.html']
          required += [filename for _, script, template in dashboards for filename in (script, template)]
          missing = [filename for filename in required if not (root / filename).is_file()]
          if missing:
              raise SystemExit('Required repository files are missing: ' + ', '.join(missing))

          # _site is generated output, not the location of the source templates.
          if output.exists():
              shutil.rmtree(output)
          (output / 'images').mkdir(parents=True)
          for filename in ('index.html', 'styles.css', 'images/earth-hero.png'):
              shutil.copy2(root / filename, output / filename)
          # Preserve the other source pages without running their unfinished updaters.
          for filename in ('ct.html', 'mri.html', 'pet.html', 'xray.html'):
              if (root / filename).is_file():
                  shutil.copy2(root / filename, output / filename)
          (output / '.nojekyll').touch()

          summary = ['## Dashboard refresh', '', '| Dashboard | Core observations | Headlines | FDA benchmark |',
                     '|---|---:|---:|---|']
          for label, script, template in dashboards:
              command = [sys.executable, script, '--build', str(root / template)]
              if label == 'AI' and (root / 'dashboard_data.json').is_file():
                  command += ['--data', 'dashboard_data.json']
              subprocess.run(command, check=True, timeout=300)
              shutil.copy2(root / template, output / template)
              html = (output / template).read_text(encoding='utf-8')
              match = re.search(r'<script id="dashboard-data" type="application/json">(.*?)</script>', html, re.S)
              if not match:
                  raise SystemExit(f'{template}: embedded dashboard data is missing')
              payload = json.loads(match.group(1))
              available = sum(observation.get('value') is not None
                              for region in payload['regions'].values()
                              for observation in region['metrics'].values())
              total = sum(len(region['metrics']) for region in payload['regions'].values())
              benchmark = payload['fda_benchmark']['metric']
              benchmark_status = benchmark['status']
              summary.append(f'| {label} | {available}/{total} across all region views | {len(payload["news"])} | {benchmark_status} |')
              if benchmark.get('value') is None:
                  print(f'::warning::{label}: FDA benchmark unavailable; see the source notice on the published page.')
              if payload.get('quality_messages'):
                  print(f'::warning::{label}: {len(payload["quality_messages"])} curated data checks failed; affected observations were withheld.')
              for feed_key in ('clinical_evidence', 'deployment_evidence'):
                  if payload.get(feed_key, {}).get('status') != 'live':
                      print(f'::warning::{feed_key}: retrieval unavailable; see page source status.')
              if payload.get('news_failures'):
                  print(f'::warning::{label}: one or more headline feeds were unavailable.')
          # Rebuild Glob Econ from public source observations, not a stored HTML snapshot.
          # Independent source failures remain clearly unavailable on the page.
          from ai_update_data import regional_economic_background, financing_background
          from macro_dashboard import publish_macro
          macro = publish_macro(output, root, regional_economic_background,
                                offline=False, fetch_financing=financing_background)
          for region, coverage in macro.get('economics', {}).items():
              yearly_counts = [
                  sum(isinstance(point.get('value'), (int, float)) and
                      not isinstance(point.get('value'), bool)
                      for point in card.get('history', []))
                  for card in coverage.get('cards', [])
              ]
              print(f'::notice::IMF {region}: annual growth/inflation chart observations {yearly_counts}')
              if any(n < 3 for n in yearly_counts):
                  print(f'::warning::IMF {region}: some charts have fewer than 3 valid annual points; gaps are not filled.')
          for series in macro.get('financing', []):
              count = len(series.get('history') or [])
              print(f"::notice::{series.get('label', 'US financing')}: {count} verified monthly observations, latest {series.get('period', 'unavailable')}")
              summary.append(f"{series.get('label', 'US financing')}: {count} verified monthly trend points")
              if count < 12:
                  print(f"::warning::{series.get('label', 'US financing')}: historical chart unavailable or incomplete; no substituted values.")

          for source, observation in macro.get('valuation', {}).items():
              if isinstance(observation, dict) and observation.get('status') == 'unavailable':
                  print(f'::warning::Global valuation {source}: unavailable; see published source status.')
          status = macro['briefing']['status']
          summary.append(f'Glob Econ Gemini briefing: {status}')
          if status != 'generated':
              print(f'::warning::Glob Econ Gemini briefing: {status}; showing sourced fallback.')
          summary += ['', 'Blank measures require sourced curated observations. A successful build does not mean every external source is available.']
          if os.getenv('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(summary) + '\n')
          PY

      - name: Archive validated iShares valuation readings
        # The public provider exposes current ratios, not a historical download.
        # Preserve only verified source-dated observations for future charting.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from global_valuation import write_history
          page = Path('_site/global-macro.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="macro-data" type="application/json">(.*?)</script>', page, re.S)
          if match:
              etf = json.loads(match.group(1)).get('valuation', {}).get('etf', {})
              if etf.get('status') == 'available' and all(k in etf for k in ('pe', 'pb', 'history')):
                  write_history('valuation-history.json', etf['history'])
                  print('::notice::Validated iShares P/E and P/B source-dated readings recorded.')
              else:
                  print('::notice::Latest iShares readings unavailable; no invented historical points were added.')
          PY
          if ! git diff --quiet -- valuation-history.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add valuation-history.json
            git commit -m 'Archive verified iShares valuation readings [skip ci]'
            git push origin HEAD:main || echo '::warning::Could not persist valuation archive to main; website build is unaffected.'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update-news
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
